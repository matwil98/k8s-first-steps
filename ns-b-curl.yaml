apiVersion: v1
kind: Pod
metadata:
  name: curl-01
  namespace: ns-b
  labels:
    app: curl
spec:
  containers:
  - name: curl-01
    image: curlimages/curl:latest
    command: ["sleep", "infinity"]
    resources:
      requests:
        memory: "32Mi"
        cpu: "100m"
      limits:
        memory: "64Mi"
        cpu: "200m"

